name: Keep Render Backend Warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    env:
      RENDER_URL: ${{ secrets.RENDER_URL }}
    steps:
      - name: Wake Render backend
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "Set repository secret RENDER_URL to your Render service URL."
            exit 1
          fi
          echo "Pinging Render health endpoint: $RENDER_URL/health"
          curl -fsS "$RENDER_URL/health"
